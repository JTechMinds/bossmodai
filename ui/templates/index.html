<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossMod AI</title>

    <!-- Tailwind CSS (CDN, no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ static_url('js/tailwind-config.js') }}"></script>

    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Split.js (CDN, 2KB) -->
    <script src="https://unpkg.com/split.js@1.6.5/dist/split.min.js"></script>

    <!-- Marked.js (local, markdown renderer) -->
    <script src="{{ static_url('js/vendor/marked.min.js') }}"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body class="bg-bm-bg text-bm-text h-screen flex flex-col overflow-hidden">

    <!-- ═══════════════ TOP NAV BAR ═══════════════ -->
    <nav class="bg-bm-surface border-b border-bm-border px-4 py-2 flex items-center justify-between shrink-0">
        <!-- Left: Logo -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-bm-accent rounded-lg flex items-center justify-center">
                    <i data-lucide="bot" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-bold text-lg">BossMod</span>
                <span class="text-xs text-bm-muted font-mono">v0.1</span>
            </div>
        </div>

        <!-- Center: Mode toggle (Office | Company) -->
        <div id="center-mode-toggle" class="hidden sm:flex items-center bg-slate-100 rounded-lg p-0.5 relative">
            <button data-mode="office" class="center-mode-btn active px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5">
                <i data-lucide="building" class="w-3.5 h-3.5"></i>
                Office
            </button>
            <button id="company-toggle-btn" data-mode="company" class="center-mode-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5">
                <i data-lucide="briefcase" class="w-3.5 h-3.5"></i>
                <span id="company-toggle-label">Company</span>
                <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </button>
            <!-- Company sub-tab dropdown -->
            <div id="company-subtab-dropdown" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white border border-bm-border rounded-lg shadow-lg z-50 py-1">
                <button class="company-subtab-item w-full flex items-center gap-2 px-3 py-2 text-xs text-bm-text hover:bg-bm-bg transition-colors" data-subtab="files">
                    <i data-lucide="folder" class="w-3.5 h-3.5"></i> Files
                </button>
                <button class="company-subtab-item w-full flex items-center gap-2 px-3 py-2 text-xs text-bm-text hover:bg-bm-bg transition-colors" data-subtab="tasks">
                    <i data-lucide="list-todo" class="w-3.5 h-3.5"></i> Tasks
                </button>
                <button class="company-subtab-item w-full flex items-center gap-2 px-3 py-2 text-xs text-bm-text hover:bg-bm-bg transition-colors" data-subtab="metrics">
                    <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i> Metrics
                </button>
                <button class="company-subtab-item w-full flex items-center gap-2 px-3 py-2 text-xs text-bm-text hover:bg-bm-bg transition-colors" data-subtab="org">
                    <i data-lucide="users" class="w-3.5 h-3.5"></i> Org Chart
                </button>
            </div>
        </div>

        <!-- Right: Action buttons -->
        <div class="flex items-center gap-2">
            <button id="btn-back-to-office"
                    class="hidden items-center gap-2 px-3 py-1.5 border border-bm-border text-bm-text rounded-lg
                           hover:bg-slate-50 transition-colors text-sm font-medium"
                    aria-label="Back to office">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back to Office
            </button>
            <button id="btn-runtime-kill-switch"
                    class="flex items-center gap-2 px-3 py-1.5 border border-red-300 bg-red-50 text-red-700 rounded-lg
                           hover:bg-red-100 transition-colors text-sm font-medium"
                    aria-label="Emergency pause AI runtime">
                <i data-lucide="octagon-x" class="w-4 h-4"></i>
                <span id="runtime-kill-switch-label">Emergency Pause</span>
            </button>
            <button id="btn-new-agent"
                    class="hidden sm:flex items-center gap-2 px-3 py-1.5 border border-bm-border text-bm-text rounded-lg
                           hover:bg-slate-50 transition-colors text-sm font-medium"
                    aria-label="Create new agent">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                New Agent
            </button>
            <button id="btn-settings"
                    class="p-2 rounded-lg hover:bg-slate-100 transition-colors"
                    title="Settings"
                    aria-label="Open settings">
                <i data-lucide="settings" class="w-5 h-5 text-bm-muted"></i>
            </button>
        </div>
    </nav>

    <div id="runtime-pause-banner"
         class="hidden shrink-0 border-b border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800">
        AI runtime is paused. Agents will not take new turns until you resume the system.
    </div>

    <!-- ═══════════════ SETTINGS VIEW (hidden by default) ═══════════════ -->
    <div id="settings-layout" class="flex-1 flex overflow-hidden hidden">
        <!-- Settings nav -->
        <div class="w-56 shrink-0 bg-bm-surface border-r border-bm-border p-3 overflow-y-auto">
            <div id="settings-nav" class="space-y-1"></div>
        </div>
        <!-- Settings content -->
        <div id="settings-content" class="flex-1 overflow-y-auto p-6 bg-bm-bg"></div>
    </div>

    <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
    <!-- Desktop: side-by-side with Split.js. Mobile: stacked with bottom sheet. -->
    <div id="main-layout" class="flex-1 flex overflow-hidden">

        <!-- ─── LEFT PANEL (30%) ─── -->
        <div id="panel-left" class="flex flex-col bg-bm-surface border-r border-bm-border
                                     max-sm:hidden">

            <!-- Tab headers (Focus | Company | Channels) -->
            <div id="left-panel-tabs" class="flex border-b border-bm-border shrink-0">
                <!-- Dynamically managed by AgentContext.updateTabs() -->
            </div>

            <!-- Agent chips row (agents selected this session) -->
            <div id="agent-chips" class="hidden border-b border-bm-border shrink-0 px-2 py-1.5 flex flex-wrap gap-1.5 overflow-y-auto max-h-20">
                <!-- Chips rendered dynamically by AgentContext.renderAgentChips() -->
            </div>

            <!-- Sub-view toolbar (hidden until agent selected) -->
            <div id="agent-toolbar" class="hidden border-b border-bm-border shrink-0">
                <div class="flex items-center">
                    <button data-subview="chat"
                            class="agent-subview-btn active flex-1 flex items-center justify-center gap-1.5
                                   px-3 py-2 text-xs font-medium transition-colors whitespace-nowrap overflow-hidden">
                        <i data-lucide="message-circle" class="w-3.5 h-3.5 shrink-0"></i>
                        <span class="toolbar-label">Chat</span>
                    </button>
                    <button data-subview="meeting"
                            class="agent-subview-btn flex-1 flex items-center justify-center gap-1.5
                                   px-3 py-2 text-xs font-medium transition-colors whitespace-nowrap overflow-hidden">
                        <i data-lucide="users" class="w-3.5 h-3.5 shrink-0"></i>
                        <span class="toolbar-label">Meeting</span>
                    </button>
                    <button data-subview="tasks"
                            class="agent-subview-btn flex-1 flex items-center justify-center gap-1.5
                                   px-3 py-2 text-xs font-medium transition-colors whitespace-nowrap overflow-hidden">
                        <i data-lucide="list-todo" class="w-3.5 h-3.5 shrink-0"></i>
                        <span class="toolbar-label">Tasks</span>
                    </button>
                    <button data-subview="desk"
                            class="agent-subview-btn flex-1 flex items-center justify-center gap-1.5
                                   px-3 py-2 text-xs font-medium transition-colors whitespace-nowrap overflow-hidden">
                        <i data-lucide="folder-open" class="w-3.5 h-3.5 shrink-0"></i>
                        <span class="toolbar-label">Desk</span>
                    </button>
                    <!-- Gear dropdown for Edit & Diag -->
                    <div class="relative shrink-0">
                        <button id="gear-menu-btn" type="button"
                                class="agent-subview-btn flex items-center justify-center
                                       px-3 py-2 text-xs font-medium transition-colors">
                            <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                        </button>
                        <div id="gear-menu-dropdown"
                             class="hidden absolute right-0 top-full mt-1 w-32
                                    bg-white border border-bm-border rounded-lg shadow-lg z-50 py-1">
                            <button data-subview="edit"
                                    class="gear-menu-item w-full flex items-center gap-2
                                           px-3 py-2 text-xs text-bm-text hover:bg-bm-bg transition-colors">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit
                            </button>
                            <button data-subview="diagnostics"
                                    class="gear-menu-item w-full flex items-center gap-2
                                           px-3 py-2 text-xs text-bm-text hover:bg-bm-bg transition-colors">
                                <i data-lucide="stethoscope" class="w-3.5 h-3.5"></i> Diag
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content area -->
            <div id="left-panel-content" class="flex-1 overflow-hidden relative">
                <!-- Default empty state -->
                <div id="panel-empty-state" class="absolute inset-0 flex flex-col">
                    <div class="flex-1 overflow-y-auto p-4">
                        <div class="text-bm-muted text-sm text-center mt-8">
                            <i data-lucide="message-circle" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                            <p>Click an agent on the map to start</p>
                        </div>
                    </div>
                </div>

                <!-- Agent chat sub-view -->
                <div id="subview-chat" class="absolute inset-0 flex flex-col hidden">
                    <div id="chat-messages" class="flex-1 overflow-y-auto p-4"></div>
                    <div class="p-3 border-t border-bm-border">
                        <div class="flex gap-2 items-end">
                            <textarea id="chat-input" rows="3"
                                      placeholder="Type a message... (Shift+Enter for new line)"
                                      class="flex-1 px-3 py-2 text-sm border border-bm-border rounded-lg
                                             bg-bm-bg focus:outline-none focus:ring-2 focus:ring-bm-accent/30
                                             focus:border-bm-accent resize-none"></textarea>
                            <button id="chat-send"
                                    class="px-3 py-2 bg-bm-accent text-white rounded-lg
                                           hover:bg-bm-accent-hover transition-colors shrink-0">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Agent edit sub-view -->
                <div id="subview-edit" class="absolute inset-0 overflow-y-auto p-4 hidden"></div>

                <!-- Agent meeting sub-view -->
                <div id="subview-meeting" class="absolute inset-0 flex flex-col hidden"></div>

                <!-- Agent tasks sub-view -->
                <div id="subview-tasks" class="absolute inset-0 overflow-y-auto p-4 hidden"></div>

                <!-- Agent desk sub-view -->
                <div id="subview-desk" class="absolute inset-0 overflow-y-auto p-4 hidden"></div>

                <!-- Agent diagnostics sub-view -->
                <div id="subview-diagnostics" class="absolute inset-0 overflow-y-auto hidden"></div>

                <!-- Directory tab -->
                <div id="tab-directory" class="tab-content absolute inset-0 hidden"></div>

                <!-- Channels tab -->
                <div id="tab-channels" class="tab-content absolute inset-0 hidden"></div>
            </div>
        </div>

        <!-- ─── Split handle is managed by Split.js ─── -->

        <!-- ─── RIGHT PANEL: OFFICE MAP (70%) ─── -->
        <div id="panel-map" class="flex-1 flex items-center justify-center bg-bm-bg p-2 sm:p-4">
            <div id="canvas-container" class="w-full h-full flex items-center justify-center">
                <canvas id="office-canvas" class="rounded-xl shadow-sm border border-bm-border bg-white">
                    Your browser does not support canvas.
                </canvas>
            </div>

            <!-- Company Dashboard (replaces canvas when active) -->
            <div id="company-dashboard" class="hidden w-full h-full flex flex-col overflow-hidden rounded-xl border border-bm-border bg-white">
                <div id="company-dashboard-tabs" class="flex border-b border-bm-border bg-bm-surface shrink-0">
                    <button class="company-tab-btn flex-1 px-3 py-2.5 text-xs font-medium transition-colors relative" data-tab="files">
                        <span class="flex items-center justify-center gap-1.5">
                            <i data-lucide="folder" class="w-3.5 h-3.5 shrink-0"></i> Files
                        </span>
                    </button>
                    <button class="company-tab-btn flex-1 px-3 py-2.5 text-xs font-medium transition-colors relative" data-tab="tasks">
                        <span class="flex items-center justify-center gap-1.5">
                            <i data-lucide="list-todo" class="w-3.5 h-3.5 shrink-0"></i> Tasks
                        </span>
                    </button>
                    <button class="company-tab-btn active flex-1 px-3 py-2.5 text-xs font-medium transition-colors relative" data-tab="metrics">
                        <span class="flex items-center justify-center gap-1.5">
                            <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 shrink-0"></i> Metrics
                        </span>
                    </button>
                    <button class="company-tab-btn flex-1 px-3 py-2.5 text-xs font-medium transition-colors relative" data-tab="org">
                        <span class="flex items-center justify-center gap-1.5">
                            <i data-lucide="users" class="w-3.5 h-3.5 shrink-0"></i> Org Chart
                        </span>
                    </button>
                </div>
                <div id="company-dashboard-content" class="flex-1 overflow-y-auto bg-bm-bg"></div>
            </div>

            <!-- Diagnostic detail (replaces canvas when active) -->
            <div id="diagnostic-detail-panel" class="hidden w-full h-full flex flex-col overflow-hidden rounded-xl border border-bm-border bg-white">
                <div id="diag-detail-header" class="flex items-center justify-between p-4 border-b border-bm-border bg-bm-surface shrink-0">
                    <div id="diag-detail-summary" class="flex items-center gap-3 min-w-0"></div>
                    <button id="diag-detail-close" class="p-2 rounded-lg hover:bg-slate-100 transition-colors shrink-0" title="Close detail">
                        <i data-lucide="x" class="w-5 h-5 text-bm-muted"></i>
                    </button>
                </div>
                <div id="diag-detail-body" class="flex-1 overflow-y-auto p-4 sm:p-6 bg-bm-bg"></div>
            </div>
        </div>

        <!-- ─── RIGHT PANEL: ACTIVITY (25%) ─── -->
        <div id="panel-activity" class="flex flex-col bg-bm-surface border-l border-bm-border max-sm:hidden">
            <div class="px-3 py-2.5 border-b border-bm-border shrink-0">
                <span class="flex items-center gap-1.5 text-sm font-medium text-bm-text">
                    <i data-lucide="activity" class="w-4 h-4"></i>
                    Activity
                </span>
            </div>
            <div id="activity-filters" class="px-3 py-2 border-b border-bm-border shrink-0">
                <!-- search, chips, dropdown rendered by activity.js init() -->
            </div>
            <div id="activity-feed" class="flex-1 overflow-y-auto p-3">
                <!-- entries rendered here -->
            </div>
        </div>
    </div>

    <!-- ═══════════════ FOOTER ═══════════════ -->
    <footer id="app-footer" class="shrink-0 border-t border-bm-border bg-bm-surface px-4 py-1.5 flex items-center justify-between text-xs text-bm-muted max-sm:hidden">
        <span>copyright(c) 2026 JTechMinds LLC</span>
        <div class="flex items-center gap-3">
            <span id="footer-runtime-status" class="flex items-center gap-1.5">
                <span id="footer-status-dot" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                <span id="footer-status-label">Connecting...</span>
            </span>
            <span id="footer-agent-count">0 agents</span>
            <span id="footer-uptime">--</span>
        </div>
    </footer>

    <!-- ═══════════════ MOBILE BOTTOM SHEET ═══════════════ -->
    <div id="mobile-sheet" class="sm:hidden fixed inset-x-0 bottom-0 bg-bm-surface rounded-t-2xl
                                   shadow-[0_-4px_20px_rgba(0,0,0,0.1)] border-t border-bm-border
                                   transition-transform duration-300 ease-out z-40"
         style="transform: translateY(calc(100% - 3rem));">

        <!-- Drag handle -->
        <div id="sheet-handle" class="flex justify-center py-2 cursor-grab">
            <div class="w-10 h-1 bg-slate-300 rounded-full"></div>
        </div>

        <!-- Mobile tabs -->
        <div class="flex border-b border-bm-border">
            <button class="mobile-tab-btn active flex-1 px-4 py-2 text-sm font-medium" data-tab="chat">
                <i data-lucide="message-circle" class="w-4 h-4 inline"></i> Chat
            </button>
            <button class="mobile-tab-btn flex-1 px-4 py-2 text-sm font-medium" data-tab="activity">
                <i data-lucide="activity" class="w-4 h-4 inline"></i> Activity
            </button>
        </div>

        <!-- Mobile tab content -->
        <div class="h-64 overflow-y-auto p-4">
            <div class="text-bm-muted text-sm text-center mt-4">
                <p>Swipe up to expand</p>
            </div>
        </div>
    </div>

    <!-- Agent panel overlay removed — Edit is now inline in the left panel -->

    <!-- Settings panel overlay removed — replaced by full settings view -->

    <!-- ═══════════════ SCRIPTS ═══════════════ -->
    <script src="{{ static_url('js/utils.js') }}"></script>
    <script src="{{ static_url('js/activity.js') }}"></script>
    <script src="{{ static_url('js/canvas.js') }}"></script>
    <script src="{{ static_url('js/agent-panel.js') }}"></script>
    <script src="{{ static_url('js/company-view.js') }}"></script>
    <script src="{{ static_url('js/company-dashboard.js') }}"></script>
    <script src="{{ static_url('js/company-files.js') }}"></script>
    <script src="{{ static_url('js/company-tasks.js') }}"></script>
    <script src="{{ static_url('js/company-metrics.js') }}"></script>
    <script src="{{ static_url('js/company-org.js') }}"></script>
    <script src="{{ static_url('js/channels-view.js') }}"></script>
    <script src="{{ static_url('js/agent-context.js') }}"></script>
    <script src="{{ static_url('js/diagnostics.js') }}"></script>
    <script src="{{ static_url('js/cli-policy-section.js') }}"></script>
    <script src="{{ static_url('js/settings-view.js') }}"></script>
    <script src="{{ static_url('js/app.js') }}"></script>

</body>
</html>
