<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossMod AI</title>
    <meta name="bossmod-api-token" content="{{ local_api_token }}">

    <!-- FIRST script on the page, before the vendored chrome. It patches
         window.fetch and window.WebSocket to inject the local API token;
         anything loaded ahead of it would be unauthenticated. -->
    <script src="{{ static_url('js/api-auth.js') }}"></script>

    <!-- Tailwind CSS (vendored Play CDN compiler — HA-OPS-P1-02).
         Retained for the Settings sections and the re-hosted panes, whose
         utilities resolve to the same tokens as the shell. -->
    <script src="{{ static_url('js/vendor/tailwindcss.js') }}"></script>
    <script src="{{ static_url('js/tailwind-config.js') }}"></script>

    <!-- Lucide Icons (vendored UMD 0.469.0) -->
    <script src="{{ static_url('js/vendor/lucide.min.js') }}"></script>

    <!-- Split.js (vendored 1.6.5) — the Board's table/detail divider -->
    <script src="{{ static_url('js/vendor/split.min.js') }}"></script>

    <!-- Marked.js (local, markdown renderer) -->
    <script src="{{ static_url('js/vendor/marked.min.js') }}"></script>

    <!-- Highlight.js (local, syntax highlighting) -->
    <link rel="stylesheet" href="{{ static_url('css/vendor/hljs-github-dark.css') }}">
    <script src="{{ static_url('js/vendor/highlight.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-python.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-javascript.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-typescript.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-json.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-yaml.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-xml.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-sql.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-css.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-bash.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-markdown.min.js') }}"></script>
    <script src="{{ static_url('js/vendor/hljs-lang-ini.min.js') }}"></script>

    <!-- Shell styles. tokens.css is the single source of truth for colour. -->
    <link rel="stylesheet" href="{{ static_url('css/tokens.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/base.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/shell.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/conversation.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/context.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/overlays.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/places.css') }}">
</head>
<body class="bg-bm-bg text-bm-text h-screen flex flex-col overflow-hidden">

    <!-- ═══════════════ HEADER ═══════════════ -->
    <!-- Brand, place nav, bell, Pause, and gear are rendered by shell/header.js. -->
    <header id="app-header" class="app-header"></header>

    <!-- ═══════════════ BANNERS ═══════════════ -->
    <!-- Copy lives here so it is a template fact; shell/banners.js only decides
         when each one is shown. -->
    <div id="runtime-pause-banner"
         class="hidden shrink-0 border-b border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800">
        AI runtime is paused. Agents will not take new turns until you resume the system.
    </div>

    <div id="no-model-banner"
         class="hidden shrink-0 border-b border-amber-200 bg-amber-50 px-4 py-2 text-sm text-amber-900"
         role="status">
        No AI model is connected.
        <button type="button" id="no-model-banner-settings"
                class="underline font-medium hover:text-amber-950">
            Connect a model in Settings
        </button>
        — chat Send stays disabled until a connection exists.
    </div>

    <!-- ═══════════════ SETTINGS VIEW (full-screen takeover, hidden by default) ═══════════════ -->
    <div id="settings-layout" class="flex-1 flex overflow-hidden hidden">
        <!-- Settings nav -->
        <div class="w-56 shrink-0 bg-bm-surface border-r border-bm-border p-3 overflow-y-auto">
            <div id="settings-nav" class="space-y-1"></div>
        </div>
        <!-- Settings content -->
        <div id="settings-content" class="flex-1 overflow-y-auto p-6 bg-bm-bg"></div>
    </div>

    <!-- ═══════════════ MAIN LAYOUT ═══════════════ -->
    <!-- roster | place | context. The context column exists on Chat alone;
         shell/shell.js sets data-context from the active place. -->
    <div id="main-layout" data-context="off">
        <aside id="app-roster" class="app-roster" aria-label="People and threads"></aside>
        <div id="app-place" class="app-place"></div>
        <aside id="app-context" class="app-context" aria-label="Context"></aside>
    </div>

    <!-- ═══════════════ FOOTER ═══════════════ -->
    <footer id="app-footer" class="app-footer"></footer>

    <!-- ═══════════════ SCRIPTS ═══════════════ -->
    <script src="{{ static_url('js/api-client.js') }}"></script>
    <script src="{{ static_url('js/utils.js') }}"></script>

    <script src="{{ static_url('js/core/dom.js') }}"></script>
    <script src="{{ static_url('js/core/store.js') }}"></script>
    <script src="{{ static_url('js/core/bus.js') }}"></script>
    <script src="{{ static_url('js/core/overlays.js') }}"></script>
    <script src="{{ static_url('js/core/gates.js') }}"></script>
    <script src="{{ static_url('js/core/consent-card.js') }}"></script>

    <!-- Conversation views first: needs-bar.js renders its cards through
         event-cards.js, and conversation.js builds the bar, so the needs block
         sits between them rather than before or after both. -->
    <script src="{{ static_url('js/conversation/transcript.js') }}"></script>
    <script src="{{ static_url('js/conversation/message.js') }}"></script>
    <script src="{{ static_url('js/conversation/event-cards.js') }}"></script>
    <script src="{{ static_url('js/conversation/chrome.js') }}"></script>
    <script src="{{ static_url('js/conversation/composer.js') }}"></script>
    <script src="{{ static_url('js/conversation/system-receipts.js') }}"></script>

    <script src="{{ static_url('js/needs/need-shape.js') }}"></script>
    <script src="{{ static_url('js/needs/needs-store.js') }}"></script>
    <script src="{{ static_url('js/needs/needs-popover.js') }}"></script>
    <script src="{{ static_url('js/needs/needs-bar.js') }}"></script>
    <script src="{{ static_url('js/needs/needs-toast.js') }}"></script>

    <!-- The one assign form. It ships with the Board, which owns it, but the
         composer's clipboard button opens it too (spec 4.4), so it is defined
         before conversation.js rather than beside the rest of the Board. -->
    <script src="{{ static_url('js/places/board/assign-outcomes.js') }}"></script>
    <script src="{{ static_url('js/places/board/assign-form.js') }}"></script>

    <script src="{{ static_url('js/conversation/sources/thread-archive.js') }}"></script>
    <script src="{{ static_url('js/conversation/sources/thread-source.js') }}"></script>
    <script src="{{ static_url('js/conversation/sources/agent-source.js') }}"></script>
    <script src="{{ static_url('js/conversation/conversation.js') }}"></script>

    <script src="{{ static_url('js/shell/places.js') }}"></script>
    <script src="{{ static_url('js/shell/session.js') }}"></script>
    <script src="{{ static_url('js/shell/socket.js') }}"></script>
    <script src="{{ static_url('js/shell/header.js') }}"></script>
    <script src="{{ static_url('js/shell/roster-threads.js') }}"></script>
    <script src="{{ static_url('js/shell/roster.js') }}"></script>
    <script src="{{ static_url('js/shell/footer.js') }}"></script>
    <script src="{{ static_url('js/shell/banners.js') }}"></script>
    <script src="{{ static_url('js/shell/shortcuts.js') }}"></script>

    <script src="{{ static_url('js/cli-policy-simulator.js') }}"></script>
    <script src="{{ static_url('js/cli-policy-section.js') }}"></script>
    <script src="{{ static_url('js/settings-shared.js') }}"></script>
    <script src="{{ static_url('js/settings-connections.js') }}"></script>
    <script src="{{ static_url('js/settings-personalities.js') }}"></script>
    <script src="{{ static_url('js/settings-system.js') }}"></script>
    <script src="{{ static_url('js/settings-prompt-template.js') }}"></script>
    <script src="{{ static_url('js/settings-advanced.js') }}"></script>
    <script src="{{ static_url('js/settings-runtime-contracts.js') }}"></script>
    <script src="{{ static_url('js/settings-telegram.js') }}"></script>
    <script src="{{ static_url('js/settings-view.js') }}"></script>

    <!-- Files: the shared viewer and the dialogs come first, because the desk
         browser opens the viewer and the Board's deliverable cards do too.
         desk-opener.js leads the block: it owns the "which file manager does
         this machine use" prompt, and places/files/folder-opener.js delegates
         to it rather than keeping a second copy. -->
    <script src="{{ static_url('js/context/desk-opener.js') }}"></script>
    <script src="{{ static_url('js/places/files/file-content.js') }}"></script>
    <script src="{{ static_url('js/places/files/file-form.js') }}"></script>
    <script src="{{ static_url('js/places/files/file-ops.js') }}"></script>
    <script src="{{ static_url('js/places/files/file-viewer.js') }}"></script>
    <script src="{{ static_url('js/places/files/files-data.js') }}"></script>
    <script src="{{ static_url('js/places/files/host-roots.js') }}"></script>
    <script src="{{ static_url('js/places/files/folder-opener.js') }}"></script>
    <script src="{{ static_url('js/places/files/file-grid.js') }}"></script>
    <script src="{{ static_url('js/places/files/file-actions.js') }}"></script>
    <script src="{{ static_url('js/places/files/files-toolbar.js') }}"></script>
    <script src="{{ static_url('js/places/files/files-place.js') }}"></script>

    <!-- The context column hosts the agent form, which reaches into
         SettingsView, and the desk browser, which opens the shared file
         viewer. Both must already be defined, so this block loads last before
         the shell boots. -->
    <script src="{{ static_url('js/agent-panel.js') }}"></script>
    <script src="{{ static_url('js/context/mini-office.js') }}"></script>
    <script src="{{ static_url('js/context/agent-edit.js') }}"></script>
    <script src="{{ static_url('js/context/desk-files.js') }}"></script>
    <script src="{{ static_url('js/context/desk-tasks.js') }}"></script>
    <script src="{{ static_url('js/context/desk-actions.js') }}"></script>
    <script src="{{ static_url('js/context/desk-panel.js') }}"></script>
    <script src="{{ static_url('js/context/context-column.js') }}"></script>

    <script src="{{ static_url('js/places/chat/chat-place.js') }}"></script>

    <!-- Office: sprites and the motion layer before the canvas that drives
         them, the canvas before the place that mounts it. -->
    <script src="{{ static_url('js/places/office/canvas-sprites.js') }}"></script>
    <script src="{{ static_url('js/places/office/canvas-motion.js') }}"></script>
    <script src="{{ static_url('js/places/office/office-canvas.js') }}"></script>
    <script src="{{ static_url('js/places/office/org-view.js') }}"></script>
    <script src="{{ static_url('js/places/office/ticker.js') }}"></script>
    <script src="{{ static_url('js/places/office/office-place.js') }}"></script>

    <!-- Board: the column map first, then the data layer over it, then the
         views, then the place that wires them together. -->
    <script src="{{ static_url('js/places/board/board-columns.js') }}"></script>
    <script src="{{ static_url('js/places/board/board-data.js') }}"></script>
    <script src="{{ static_url('js/places/board/board-grid.js') }}"></script>
    <script src="{{ static_url('js/places/board/task-card.js') }}"></script>
    <script src="{{ static_url('js/places/board/task-deliverables.js') }}"></script>
    <script src="{{ static_url('js/places/board/task-events.js') }}"></script>
    <script src="{{ static_url('js/places/board/task-detail.js') }}"></script>
    <script src="{{ static_url('js/places/board/board-cancel.js') }}"></script>
    <script src="{{ static_url('js/places/board/board-toolbar.js') }}"></script>
    <script src="{{ static_url('js/places/board/board-place.js') }}"></script>

    <!-- Metrics: the two renderers, then the place that fetches for them. -->
    <script src="{{ static_url('js/places/metrics/metric-cards.js') }}"></script>
    <script src="{{ static_url('js/places/metrics/metric-bars.js') }}"></script>
    <script src="{{ static_url('js/places/metrics/metrics-place.js') }}"></script>

    <!-- Log: the shape both feeds normalise into, then the source over them,
         then the views, then the place that wires them together. -->
    <script src="{{ static_url('js/places/log/log-shape.js') }}"></script>
    <script src="{{ static_url('js/places/log/log-source.js') }}"></script>
    <script src="{{ static_url('js/places/log/log-row.js') }}"></script>
    <script src="{{ static_url('js/places/log/log-filters.js') }}"></script>
    <script src="{{ static_url('js/places/log/diagnostic-detail.js') }}"></script>
    <script src="{{ static_url('js/places/log/log-place.js') }}"></script>


    <!-- Boots last: every module it wires must already be defined. -->
    <script src="{{ static_url('js/shell/shell.js') }}"></script>

</body>
</html>
