<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=960, initial-scale=1.0" />
  <title>Browser Vision Test Page</title>
  <style>
    html {
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      width: 960px;
      height: 960px;
      position: relative;
      overflow: visible;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
    }

    #scroll-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 3000px;
      overflow-y: auto;
      z-index: 0;
      background: #f7f7f7;
    }

    #scroll-content {
      width: 960px;
      height: 3000px;
      box-sizing: border-box;
    }

    .scroll-section {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      color: #333333;
      border-bottom: 2px solid #cccccc;
      box-sizing: border-box;
    }

    #grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 960px;
      display: grid;
      grid-template-columns: repeat(10, 96px);
      grid-template-rows: repeat(10, 96px);
      z-index: 1;
      background: #ffffff;
    }

    .cell {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #888888;
      box-sizing: border-box;
      font-size: 24px;
      color: #222222;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
    }

    .cell:hover {
      background: #e8f0ff;
    }

    #test-input {
      position: absolute;
      left: 380px;
      top: 460px;
      width: 200px;
      height: 40px;
      z-index: 10;
      box-sizing: border-box;
      border: 2px solid #333333;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 16px;
      text-align: center;
      background: #ffffff;
    }

    #counter-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      width: 120px;
      height: 40px;
      border: 2px solid #333333;
      border-radius: 4px;
      background: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    #counter-btn:hover {
      background: #e8f0ff;
    }

    #counter-label {
      position: absolute;
      top: 20px;
      right: 144px;
      z-index: 10;
      font-size: 18px;
      color: #222222;
    }
  </style>
</head>
<body>
  <div id="scroll-area">
    <div id="scroll-content"></div>
  </div>

  <div id="grid"></div>

  <input id="test-input" type="text" aria-label="Test input" />

  <span id="counter-label">Counter: <span id="counter">0</span></span>
  <button id="counter-btn" type="button">Increment</button>

  <script>
    (function () {
      var counterEl = document.getElementById("counter");
      var count = 0;

      function increment() {
        count += 1;
        counterEl.textContent = String(count);
      }

      document.getElementById("counter-btn").addEventListener("click", function () {
        increment();
      });

      var grid = document.getElementById("grid");
      for (var i = 1; i <= 100; i += 1) {
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = String(i);
        cell.addEventListener("click", function () {
          increment();
        });
        grid.appendChild(cell);
      }

      var scrollContent = document.getElementById("scroll-content");
      for (var s = 1; s <= 10; s += 1) {
        var section = document.createElement("div");
        section.className = "scroll-section";
        section.textContent = "Section " + s;
        scrollContent.appendChild(section);
      }
    })();
  </script>
</body>
</html>
